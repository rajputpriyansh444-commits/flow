working_dir: .
env:
  - FROM_ROOT_ENV: "${FLOW_SECRETS_VAULT_TOKEN}"
  - FROM_ENV_REF: "${env.FLOW_ENCRYPTION_KEY}"
steps:
  - name: process-env
    action: exec
    with:
      command: ./write_env
      args:
        - flow-credentials-env.txt
        - FLOW_ENCRYPTION_KEY
        - FLOW_SECRETS_VAULT_TOKEN
        - FLOW_CONFORMANCE_SETTING
        - FROM_ROOT_ENV
        - FROM_ENV_REF
  - name: expansion
    depends: [process-env]
    action: exec
    with:
      command: ./write_arg
      args:
        - flow-credentials-expansion.txt
        - $FLOW_ENCRYPTION_KEY|${FLOW_SECRETS_VAULT_TOKEN}|$FLOW_CONFORMANCE_SETTING
